<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steveinator</title>
  <style>
    :root { --bg: #0b0f0c; --fg: #e6efe8; --muted: #8a9a8e; --accent: #a3e635; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f8f6; --fg: #111; --muted: #5b665e; --accent: #4d7c0f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    .status { color: var(--accent); }
    p { color: var(--muted); margin: .25rem 0; }
    code { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Steveinator</h1>
    <p class="status">● online</p>
    <p>Página de prueba servida desde el server de Hermes por un túnel reverso.</p>
    <p>Hora del server al cargar: <code id="now"></code></p>
    <p>I'll be back. 🐈</p>
  </main>
  <script>document.getElementById('now').textContent = new Date().toLocaleString('es-AR');</script>
</body>
</html>
